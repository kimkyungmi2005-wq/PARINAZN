<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گالری آثار و مقالات | حالِ خوب من</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6C5CE7; --secondary: #00CEC9; --accent: #FD79A8;
            --bg: linear-gradient(135deg, #1e1b4b 0%, #311b92 50%, #4a148c 100%);
            --glass: rgba(20, 15, 45, 0.7); --border: rgba(255, 255, 255, 0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { background: var(--bg); background-attachment: fixed; min-height: 100vh; color: #fff; padding: 20px; }
        
        nav { max-width: 1200px; margin: 10px auto 35px auto; background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; padding: 14px 25px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.4rem; display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; }
        .logo i { color: var(--secondary); }
        .nav-links { display: flex; list-style: none; gap: 8px; align-items: center; }
        .nav-links a { text-decoration: none; color: #f1f2f6; font-weight: 500; padding: 9px 15px; border-radius: 12px; transition: 0.3s; font-size: 0.92rem; display: flex; align-items: center; gap: 7px; }
        .nav-links a:hover { background: rgba(255,255,255,0.2); }

        .container { max-width: 1000px; margin: 0 auto; }
        .glass-box { background: var(--glass); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 25px; padding: 35px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .art-card { background: rgba(0,0,0,0.3); border-radius: 18px; overflow: hidden; border: 1px solid var(--border); }
        .art-card img { width: 100%; height: 190px; object-fit: cover; }
        .art-info { padding: 18px; text-align: right; }

        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 12px; border: none; outline: none; background: rgba(255,255,255,0.9); color: #333; font-size: 0.95rem; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1rem; transition: 0.3s; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo"><i class="fa-solid fa-heart-pulse"></i><span>حالِ خوب من</span></a>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fa-solid fa-house"></i> خانه</a></li>
            <li><a href="counseling.html"><i class="fa-solid fa-ear-listen"></i> گوش شنوا</a></li>
            <li><a href="gallery.html" style="background: rgba(255,255,255,0.2);"><i class="fa-solid fa-palette"></i> گالری آثار</a></li>
            <li><a href="mood.html"><i class="fa-solid fa-smile"></i> حالت چطوره؟</a></li>
            <li><a href="about.html"><i class="fa-solid fa-lightbulb"></i> سازنده</a></li>
        </ul>
    </nav>

    <div class="container">
        <!-- فرم ثبت اثر و مقاله -->
        <div class="glass-box">
            <h2><i class="fa-solid fa-cloud-arrow-up"></i> ثبت اثر هنری، تصویر هوش مصنوعی یا مقاله</h2>
            <form id="artForm" onsubmit="uploadArt(event)">
                <input type="text" id="title" placeholder="عنوان اثر یا مقاله" required>
                <input type="text" id="author" placeholder="نام پدیدآورنده (دانش‌آموز)" required>
                <input type="text" id="school" placeholder="نام مدرسه و شهر" required>
                <select id="technique">
                    <option value="🎨 نقاشی دستی / مداد رنگی / سیاه‌قلم">🎨 نقاشی دستی / مداد رنگی / سیاه‌قلم</option>
                    <option value="🤖 تصویر تولید شده با هوش مصنوعی">🤖 تصویر تولید شده با هوش مصنوعی</option>
                    <option value="📝 مقاله یا دل‌نوشته روان‌شناختی">📝 مقاله یا دل‌نوشته روان‌شناختی</option>
                </select>
                <textarea id="description" placeholder="توضیحات کامل اثر، ایده سازنده یا خلاصه مقاله..." style="height: 90px;" required></textarea>
                <input type="file" id="file" accept="image/*" required style="color: white; padding: 8px;">
                <button type="submit" class="btn">ثبت و انتشار اثر در گالری ✨</button>
            </form>
        </div>

        <h2>گالری آثار دانش‌آموزی</h2>
        <div id="artGrid" class="grid"></div>
    </div>

    <script>
        window.onload = function() {
            renderArts();
        };

        function uploadArt(e) {
            e.preventDefault();
            const fileInput = document.getElementById('file').files[0];
            if(!fileInput) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const newArt = {
                    id: Date.now(),
                    title: document.getElementById('title').value,
                    author: document.getElementById('author').value,
                    school: document.getElementById('school').value,
                    technique: document.getElementById('technique').value,
                    description: document.getElementById('description').value,
                    image: evt.target.result,
                    status: "در انتظار داوری مدیر/مشاور"
                };

                const arts = JSON.parse(localStorage.getItem('app_arts') || '[]');
                arts.unshift(newArt);
                localStorage.setItem('app_arts', JSON.stringify(arts));

                alert('✨ اثر شما با موفقیت ثبت شد و برای داوری در پنل مدرسه قرار گرفت!');
                document.getElementById('artForm').reset();
                renderArts();
            };
            reader.readAsDataURL(fileInput);
        }

        function renderArts() {
            const grid = document.getElementById('artGrid');
            const arts = JSON.parse(localStorage.getItem('app_arts') || '[]');
            grid.innerHTML = '';

            if(arts.length === 0) {
                grid.innerHTML = '<p style="opacity: 0.8;">هنوز اثری در گالری ثبت نشده است.</p>';
                return;
            }

            arts.forEach(art => {
                const card = document.createElement('div');
                card.className = 'art-card';
                card.innerHTML = `
                    <img src="${art.image}">
                    <div class="art-info">
                        <span style="background: var(--accent); color: #fff; padding: 3px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold;">${art.technique}</span>
                        <h3 style="margin-top: 10px; font-size: 1.1rem;">${art.title}</h3>
                        <p style="font-size: 0.88rem; opacity: 0.9; margin: 5px 0;">پدیدآورنده: ${art.author} (${art.school})</p>
                        <p style="font-size: 0.85rem; opacity: 0.75; line-height: 1.5; background: rgba(255,255,255,0.08); padding: 8px; border-radius: 8px;">${art.description}</p>
                        <p style="font-size: 0.78rem; color: var(--secondary); margin-top: 8px;"><i class="fa-solid fa-circle-check"></i> وضعیت: ${art.status}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
